name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit and database tests
        run: npm test

      - name: TypeScript check
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Codespaces demo startup smoke test
        run: |
          bash .devcontainer/start-demo.sh
          curl --fail --silent --show-error http://127.0.0.1:3000/api/session
          curl --fail --silent --show-error http://127.0.0.1:3000/ > /dev/null
